---
- name: Lookup DEV admin user by username
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users?username={{ dev_admin_user.username | urlencode }}&exact=true"
    method: GET
    headers:
      Authorization: "Bearer {{ kc_access_token }}"
      Accept: application/json
    return_content: true
  register: kc_users

- name: Set DEV admin user facts
  ansible.builtin.set_fact:
    kc_admin_user_exists: "{{ (kc_users.json | length) > 0 }}"
    kc_admin_user_id: "{{ (kc_users.json[0].id) if (kc_users.json | length) > 0 else '' }}"

# 1) Crear usuario si no existe
- name: Create DEV admin user if missing
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users"
    method: POST
    headers:
      Authorization: "Bearer {{ kc_access_token }}"
      Content-Type: application/json
    body_format: json
    body:
      username: "{{ dev_admin_user.username }}"
      email: "{{ dev_admin_user.email }}"
      firstName: "{{ dev_admin_user.firstName }}"
      lastName: "{{ dev_admin_user.lastName }}"
      enabled: "{{ dev_admin_user.enabled }}"
      emailVerified: true
      # Obligatorio: cambio de password al primer login
      requiredActions:
        - "UPDATE_PASSWORD"
    status_code: [201, 409]
  when: not kc_admin_user_exists

# 2) Re-consultar userId (si se creó ahora)
- name: Re-lookup DEV admin user id after create
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users?username={{ dev_admin_user.username | urlencode }}&exact=true"
    method: GET
    headers:
      Authorization: "Bearer {{ kc_access_token }}"
      Accept: application/json
    return_content: true
  register: kc_users_after
  when: not kc_admin_user_exists

- name: Set DEV admin user id fact (final)
  ansible.builtin.set_fact:
    kc_admin_user_id: >-
      {{
        (kc_users_after.json[0].id)
        if (not kc_admin_user_exists)
        else (kc_admin_user_id)
      }}

- name: Fail if DEV admin user id is missing
  ansible.builtin.fail:
    msg: "DEV admin user {{ dev_admin_user.username }} was not found after create/lookup."
  when: kc_admin_user_id | length == 0

# 3) Set password temporal (determinístico)
- name: Set DEV admin user temporary password
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users/{{ kc_admin_user_id }}/reset-password"
    method: PUT
    headers:
      Authorization: "Bearer {{ kc_access_token }}"
      Content-Type: application/json
    body_format: json
    body:
      type: "password"
      value: "{{ dev_admin_user.password }}"
      temporary: "{{ dev_admin_user.temporary_password }}"
    status_code: [204]
  when: dev_admin_user.password is defined

# 4) Obtener representaciones de roles (para asignar N roles)
- name: Get realm role representations for DEV admin user
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/roles/{{ item | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ kc_access_token }}"
      Accept: application/json
    return_content: true
  loop: "{{ dev_admin_user.roles }}"
  register: kc_roles
  when: dev_admin_user.roles is defined and (dev_admin_user.roles | length) > 0

# 5) Asignar roles del realm al usuario
- name: Assign realm roles to DEV admin user
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/{{ realm_name }}/users/{{ kc_admin_user_id }}/role-mappings/realm"
    method: POST
    headers:
      Authorization: "Bearer {{ kc_access_token }}"
      Content-Type: application/json
    body_format: json
    body: "{{ kc_roles.results | map(attribute='json') | list }}"
    status_code: [204, 409]
  when: dev_admin_user.roles is defined and (dev_admin_user.roles | length) > 0
