version: "3.8"

services:
  # =========================
  # Keycloak para autenticación (DEV)
  # =========================
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.5
    container_name: dev-keycloak
    labels:
      - "org.springframework.boot.ignore=true"
    ports:
      - "8083:8080"
    environment:
      # Credenciales admin
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # DEV: habilitamos health para poder hacer readiness simple
      KC_HEALTH_ENABLED: "true"
      # DEV: http sin TLS
      KC_HTTP_ENABLED: "true"
      # DEV: métricas no son necesarias
      KC_METRICS_ENABLED: "false"
    volumes:
      # Import del realm al arrancar
      - ./.keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    command:
      # start-dev: modo desarrollo (rápido, sin necesidad de configuración TLS)
      - "start-dev"
      # --import-realm: importa automáticamente los realms dentro de /opt/keycloak/data/import
      - "--import-realm"
      # Por claridad, fija el puerto interno HTTP
      - "--http-port=8080"
    healthcheck:
      test: [ "CMD-SHELL", "sh -lc 'echo > /dev/tcp/127.0.0.1/8080'" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  keycloak-ansible:
    build:
      context: ./.keycloak/ansible
      dockerfile: Dockerfile
    container_name: keycloak-ansible
    # Solo ejecuta cuando invocas el profile bootstrap
    profiles: ["bootstrap"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      # Monta playbook/roles dentro del contenedor
      - ./.keycloak/ansible:/work:ro
    working_dir: /work
    command: >
      sh -lc "
        ansible-galaxy collection install -r requirements.yml &&
        ansible-playbook -i inventory.ini playbook.yml
      "

  # =========================
  # MySQL
  # =========================
  mysql:
    image: mysql:8.0.36
    container_name: markenx-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_TCP_PORT: 3306
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
